# Local development stack. This is not a production deployment configuration.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      FRONTEND_URL: http://localhost:5174
      MONGO_URI: mongodb://mongo:27017/eco_petcare
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
    depends_on:
      - mongo
      - redis

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_dev_data:
